<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="myall.css">
</head>

<body>
    <div class="container">
        <div class="row p-2">
            <div class="col-12 bg-light">
                <div class="display-5 text-bg-primary fw-900 text-center py-3 my-3">課程線上報名表</div>
                <div>
                    <div class="mb-3">
                        <label for="username" class="form-label">姓名</label>
                        <input type="text" class="form-control form-control-lg" id="username" placeholder="姓名字串長度2~8">
                        <div class="valid-feedback">姓名字串長度符合規定</div>
                        <div class="invalid-feedback">姓名字串長度不符合規定</div>
                    </div>
                </div>
                <div>
                    <!-- Email包含@字元，使用include()長8-15字 -->
                    <div class="mb-3">
                        <label for="Email" class="form-label">Email</label>
                        <input type="text" class="form-control form-control-lg" id="Email"
                            placeholder="Email字串長度8~15且須包含@">
                        <div class="valid-feedback">Email字串符合規定</div>
                        <div class="invalid-feedback">Email字串不符合規定</div>
                    </div>
                </div>
                <div>
                    <!-- 密碼8-16字 -->
                    <div class="mb-3">
                        <label for="password" class="form-label">密碼</label>
                        <input type="text" class="form-control form-control-lg" id="password"
                            placeholder="長度 8~16，且必須包含大小寫英文字母及特殊符號">
                        <div class="valid-feedback">密碼字串長度符合規定</div>
                        <div class="invalid-feedback">密碼字串長度不符合規定</div>
                    </div>
                </div>
                <div>
                    <!-- 手機10字開頭為09-XXXXXXXX使用startwith() -->
                    <label for="phone" class="form-label">手機</label>
                    <div class="mb-3 input-group">
                        <span class="input-group-text">09</span>
                        <input type="text" class="form-control form-control-lg" id="phone" placeholder="手機號碼加上09共10碼數字">
                        <div class="valid-feedback">手機字串長度符合規定</div>
                        <div class="invalid-feedback">手機字串長度不符合規定</div>
                    </div>
                </div>
                <div>
                    <label for="phone" class="form-label">請選擇縣市</label>
                    <div class="mb-3 input-group">
                        <select name="" id="city" class="form-select form-select-lg">
                        </select>
                        <div class="valid-feedback">已選擇縣市</div>
                        <div class="invalid-feedback">未選擇縣市</div>
                    </div>
                    </label>
                </div>
                <div class="mb-3">
                    <label for="" class="form-label">感興趣的課程(複選)</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="chk01" value="HTML/CSS" name="interest">
                            <label for="chk01" class="form-check-label">HTML/CSS</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="chk02" value="JavaScript"
                                name="interest">
                            <label for="chk02" class="form-check-label">JavaScript</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="chk03" value="Python" name="interest">
                            <label for="chk03" class="form-check-label">Python</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="chk04" value="AI" name="interest">
                            <label for="chk04" class="form-check-label">AI</label>
                        </div>

                    </div>
                    <label for="interest_msg" class="form-label text-secondary" id="interest_msg">請選擇課程</label>
                </div>
            </div>
            <!-- radio -->
            <div class="mb-3">
                <label for="" class="form-label">偏好的上課方式(單選)</label>
                <div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="rad01" value="實體" name="classmode">
                        <label for="rad01" class="form-check-label">實體</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="rad02" value="線上" name="classmode">
                        <label for="rad02" class="form-check-label">線上</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="rad03" value="混合" name="classmode">
                        <label for="rad03" class="form-check-label">混合</label>
                    </div>
                </div>
                <label for="classmode" class="form-label text-secondary" id="classmode_msg">請選擇上課方式</label>
            </div>
            <!-- switch -->
            <div class="mb-3">
                <label for="" class="form-label">課程通知設定</label>
                <div>
                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" id="switch01">
                        <label for="switch01" class="form-check-label">是否接收最新課程資訊</label>
                    </div>
                </div>
                <div class="text-secondary mt-2" id="switch_msg">目前狀態:關閉</div>
            </div>
            <div class="mb-3">
                <label for="" class="form-label">程式能力自我評估:
                    <span class="text-bg-primary fw-900 fs-3" id="range_value">5</span>
                </label>
                <input type="range" class="form-range" min="1" max="10" value="5" id="range01">
                <div class="d-flex justify-content-between">
                    <span class="text-bg-secondary">1-完全不會</span>
                    <span class="text-bg-secondary">10-非常熟悉</span>
                </div>
            </div>
        </div>
        <div class="col-12 text-center mt-3">
            <button class="btn btn-primary" id="ok_btn">確認送出</button>
            <button class="btn btn-secondary" id="re_btn">重新填寫</button>
        </div>
    </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="display-5 text-bg-success fw-900 text-center py-3 my-3">報名資料確認</div>
            <div>
                <div class="col-12" id="showmsg"></div>
            </div>
        </div>
    </div>
    </div>
    <script src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let flag_username = false;
        let flag_Email = false;
        let flag_password = false;
        let flag_phone = false;
        let flag_city = false;
        let flag_interest = false;
        let flag_classmode = false;

        let interest = [];
        let classmode = [];
        let switchstatus = false;
        let rangenum = 5;
        //及時監聽輸入內容 #username
        $(function () {
            $("#username").on("input", function () {
                //console.log($("#username").val());
                //LocalStorage暫存
                let username = $(this).val();
                localStorage.setItem("username", username);

                if ($(this).val().length > 1 && $(this).val().length < 9) {
                    console.log("符合規定!");
                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");
                    flag_username = true;
                }
                else {
                    console.log("不符合規定!");
                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");
                    flag_username = false;
                }
            });
            //網頁重新載入時取得暫存資料
            let savedUsername = localStorage.getItem("username")
            if(savedUsername!=null)
            {
            $("#username").val(savedUsername);
            //執行驗證
            $("#username").trigger("input");
        }
        })
        $(function () {
            //及時監聽輸入內容 #mail
            $("#Email").on("input", function () {
                let email = $(this).val();
                let regex = /^(?=.{9,15}$)[^@]*@[^@]*$/;
                localStorage.setItem("Email", email);

                if (regex.test(email)) {
                    console.log("符合規定!");
                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");
                    flag_Email = true;
                } else {
                    console.log("不符合規定!");
                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");
                    flag_Email = false;
                }
            });
            //網頁重新載入時取得暫存資料
            let email = localStorage.getItem("Email")
            if(email!=null)
            {
            $("#Email").val(email);
            //執行驗證
            $("#Email").trigger("input");
        }
        })
        $(function () {
            $("#password").on("input", function () {
                let password = $(this).val();
                let regex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[^A-Za-z0-9\s])(?=.{8,16}$).*$/;

                if (regex.test(password)) {
                    console.log("符合規定!");
                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");
                    flag_password = true;
                } else {
                    console.log("不符合規定!");
                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");
                    flag_password = false;
                }
            });
        });
        $(function () {
            //及時監聽輸入內容 #phone
            $("#phone").on("input", function () {
                //或寫if(phone.lenght==10&&phone.startsWith("09"))
                let phone = $(this).val();
                let regex = /^\d{8}$/;
                localStorage.setItem("phone", phone);
                if (regex.test(phone)) {
                    console.log("符合規定!");
                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");
                    flag_phone = true;
                }
                else {
                    console.log("不符合規定!");
                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");
                    flag_phone = false;
                }
            });
            //網頁重新載入時取得暫存資料
            let phone = localStorage.getItem("phone")
            if(phone != null)
            {
            $("#phone").val(phone);
            //執行驗證
            $("#phone").trigger("input");
            }
        })
        //輸入完成後離開欄位才觸發
        // $("#username").on("change",function(){
        //     console.log("change:"+$(this).val());
        // })
        //縣市選單使用外部資料產生select選單
        $.ajax({
            type: "GET",
            url: "TaiwanAddressCityAreaRoadChineseEnglishJSON-master/CityCountyData.json",
            dataType: "JSON",
            success: showdata_city,
            error: function () {
                alert("error - TaiwanAddressCityAreaRoadChineseEnglishJSON-master/CityCountyData.json")
            }
        })
        function showdata_city(data) {
            console.log(data);

            $("#city").empty();
            $("#city").append(`<option value="" selected disabled class="text-center fw-900">---請選擇縣市名稱---</option>`)
            data.forEach(function (item, index) {
                console.log(item.CityName);
                const count = index + 1
                const strHTML = `<option value="${item.CityName}">${count}:${item.CityName}</option>`;
                $("#city").append(strHTML);
            })
            //監聽縣市選單city change事件
            $("#city").on("change", function () {
                console.log($(this).val());
                $(this).removeClass("is-invalid");
                $(this).addClass("is-valid");
                flag_city = true;
            })
        }

        //Radio chang監聽
        $("input[name='interest']").on("change", function () {
            //取得所有以勾選的checkbox
            interest = [];
            $("input[name='interest']:checked").each(function () {
                console.log($(this).val());
                interest.push($(this).val());
            });
            console.log(interest);

            if (interest.length > 0) {
                flag_interest = true;
                $("#interest_msg")
                    .removeClass("text-secondary text-danger")
                    .addClass("text-success")
                    .text("已選擇" + interest.length + "項課程")
            }
            else {
                flag_interest = false;
                $("#interest_msg")
                    .removeClass("text-secondary text-success")
                    .addClass("text-danger")
                    .text("請至少選擇一項課程")
            }
        });



        $("input[name='classmode']").on("change", function () {
            classmode = $("input[name='classmode']:checked").val();
            //已選擇上課方式
            if (classmode) {
                flag_classmode = true;
                $("#classmode_msg")
                    .removeClass("text-secondary")
                    .addClass("text-success")
                    .text("目前選擇" + classmode + "課程")
            }
        });

        $("#switch01").on("change", function () {

            switchstatus = $(this).is(":checked");
            if (switchstatus) {
                $("#switch_msg")
                    .removeClass("text-secondary")
                    .addClass("text-success")
                    .text("目前狀態:開啟")
            }
            else {
                $("#switch_msg")
                    .removeClass("text-success")
                    .addClass("text-secondary")
                    .text("目前狀態:關閉")
            }
        })

        $("#range01").on("input", function () {
            rangenum = $(this).val();
            console.log(rangenum);
            $("#range_value").text(rangenum);
        });

        $(function () {
            $("#ok_btn").on("click", function () {
                if (flag_username == true && flag_Email == true && flag_password == true && flag_phone == true && flag_city == true && flag_interest == true && flag_classmode == true) {
                    console.log("符合規定");

                    let selectedClassmode =
                        $("input[name='classmode']:checked").val();

                    // 取得 Switch 狀態
                    let switch_msg = switchstatus ? "開啟" : "關閉";

                    const strHTML = `<div class="h2">姓名:${$("#username").val()}</div>
                    <div class="h2">Email:${$("#Email").val()}</div>
                    <div class="h2">密碼:XXX${$("#password").val()}</div>
                    <div class="h2">電話:09${$("#phone").val()}</div>
                    <div class="h2">居住地:${$("#city").val()}</div>
                    <div class="h2">感興趣的課程:${interest.join("、")}</div>
                    <div class="h2">偏好上課方式:${selectedClassmode}</div>
                    <div class="h2">是否接收最新訊息:${switch_msg}</div>
                    <div class="h2">程式能力自我評估分數:${rangenum}</div>`;
                    $("#showmsg").html(strHTML);

                    //清除lacalstorage
                    clearLocalStorage();
                }
                else {
                    console.log("不符合規定");
                    // alert("不符合規定請重新輸入")
                    //sweetalert2
                    Swal.fire({
                        title: "表單內容錯誤，請修正",
                        showDenyButton: false,
                        showCancelButton: false,
                        confirmButtonText: "確認",
                        denyButtonText: `Don't save`,
                        icon: "error"
                    }).then((result) => {
                        /* Read more about isConfirmed, isDenied below */
                        if (result.isConfirmed) {
                            //重整畫面
                            location.href = "20261015-Form-EX1.html"
                        }
                    });
                }
            });
        });
        function clearLocalStorage(){
            localStorage.removeItem("username");
            localStorage.removeItem("Email");
            localStorage.removeItem("phone");
        }
        $(function () {
            $("#re_btn").on("click", function () {
                // $("#username").val("");
                // $("#Email").val("");
                // $("#password").val("");
                // $("#phone").val("");
                // $("#city").html("");
                // $("#showmsg").html("");
                // flag_username = false;
                // flag_Email = false;
                // flag_password = false;
                // flag_phone = false;
                // flag_city = false;
                // $("input").removeClass("is-valid is-invalid");
                clearLocalStorage();
                location.reload();
                alert("已重置所有欄位");
            });
        });
        
    </script>
</body>

</html>
