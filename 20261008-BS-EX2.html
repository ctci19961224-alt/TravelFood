    <script>
        $(function () {
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/travel",
                dataType: "json",
                success: showdata,
                error: function () {
                    console.log("介接失敗");
                    alert("介接失敗")
                }
            });
        });
        function showdata(data) {
            console.log(data);
            $("#travel-list").empty();
            data.travel.forEach(function (item) {
                const strHTML = `<div class="col-md-6 col-lg-4 mt-3"><div class="box03">
            <img src="${item.picture}" class ="img-fluid" alt="">
            <div class="h4 fw-900 text-center mt-3">${item.name}</div>
            <div class="h3">地址:${item.district}${item.address}</div>
            <div class="h3">開放時間:${item.openingHours}</div>
            <div class="h3">簡介:${item.description}</div>
        </div>
    </div>`;
                $("#travel-list").append(strHTML);
            });
        }
    </script>
